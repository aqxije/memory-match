<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="记忆翻牌配对：适合小朋友的专注力小游戏，零依赖、离线可玩。">
  <title>记忆翻牌 · 配对记忆小游戏</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/motion.css">
</head>
<body>
  <div class="app" id="app">
    <main class="app__main" id="main">

      <!-- 主菜单 -->
      <section id="screen-menu" class="screen screen--menu" aria-labelledby="menu-title">
        <header class="menu-head">
          <h1 id="menu-title" class="title">🧠 记忆翻牌</h1>
          <p class="subtitle">记住位置，配对成功</p>
        </header>
        <div class="diff-list" role="group" aria-label="选择难度">
          <button class="diff" type="button" data-difficulty="easy" aria-pressed="true">
            <span class="diff__name">简单</span>
            <span class="diff__meta">3×4 · 6 对</span>
            <span class="diff__best" data-best="easy">最佳 0 分</span>
          </button>
          <button class="diff" type="button" data-difficulty="normal" aria-pressed="false">
            <span class="diff__name">普通</span>
            <span class="diff__meta">4×4 · 8 对</span>
            <span class="diff__best" data-best="normal">最佳 0 分</span>
          </button>
          <button class="diff" type="button" data-difficulty="hard" aria-pressed="false">
            <span class="diff__name">困难</span>
            <span class="diff__meta">5×4 · 10 对</span>
            <span class="diff__best" data-best="hard">最佳 0 分</span>
          </button>
          <button class="diff" type="button" data-difficulty="challenge" aria-pressed="false">
            <span class="diff__name">挑战</span>
            <span class="diff__meta">6×6 · 18 对</span>
            <span class="diff__best" data-best="challenge">最佳 0 分</span>
          </button>
        </div>
        <button id="btn-start" class="btn btn--primary btn--block" type="button">开始玩</button>
        <div class="menu-foot">
          <button id="btn-mute" class="btn btn--ghost" type="button" aria-pressed="false">
            <span class="btn__icon" aria-hidden="true" data-mute-icon>🔊</span><span data-mute-label>音效开</span>
          </button>
          <button id="btn-leaderboard" class="btn btn--ghost" type="button">
            <span class="btn__icon" aria-hidden="true">🏆</span><span>排行榜</span>
          </button>
        </div>
      </section>

      <!-- 游戏 -->
      <section id="screen-game" class="screen screen--game" aria-label="游戏" hidden>
        <div class="hud" id="hud" aria-label="本局信息">
          <div class="hud__row">
            <span class="hud__diff" id="hud-difficulty">简单</span>
            <span class="hud__item">分数 <strong id="hud-score">0</strong></span>
            <span class="hud__item hud__combo" id="hud-combo">连击 ×0</span>
          </div>
          <div class="hud__row">
            <span class="hud__item">步数 <strong id="hud-moves">0</strong></span>
            <span class="hud__item">用时 <strong id="hud-time">0:00</strong></span>
            <span class="hud__item" id="hud-best">最佳 0 分</span>
            <span class="hud__item hud__progress" id="hud-progress">进度 0/6</span>
          </div>
        </div>
        <div class="board-wrap">
          <p id="hint" class="hint" aria-hidden="true" hidden></p>
          <div id="board" class="board" role="group" aria-label="卡片区"></div>
        </div>
        <div class="game-foot" id="game-foot">
          <button id="btn-pause" class="btn btn--ghost" type="button"><span class="btn__icon" aria-hidden="true">⏸</span><span>暂停</span></button>
          <button id="btn-restart" class="btn btn--ghost" type="button"><span class="btn__icon" aria-hidden="true">🔄</span><span>重开</span></button>
          <button id="btn-home" class="btn btn--ghost" type="button"><span class="btn__icon" aria-hidden="true">🏠</span><span>返回</span></button>
          <button id="btn-mute-game" class="btn btn--ghost btn--mute" type="button" aria-label="音效开关" aria-pressed="false">
            <span class="btn__icon" aria-hidden="true" data-mute-icon>🔊</span><span>音效</span>
          </button>
        </div>
      </section>

      <!-- 暂停 -->
      <section id="screen-pause" class="screen screen--overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
        <div class="panel">
          <h2 id="pause-title" class="panel__title">休息一下</h2>
          <p class="panel__text">随时继续，时间不算哦</p>
          <button id="btn-resume" class="btn btn--primary btn--block" type="button">继续玩</button>
          <button id="btn-restart-pause" class="btn btn--ghost btn--block" type="button">重开</button>
          <button id="btn-home-pause" class="btn btn--ghost btn--block" type="button">返回菜单</button>
        </div>
      </section>

      <!-- 结算 -->
      <section id="screen-result" class="screen screen--overlay" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
        <div class="panel panel--result">
          <h2 id="result-title" class="panel__title">全部配对成功！</h2>
          <div class="stars" id="result-stars" role="img" aria-label="星级">
            <span class="star" data-star="1" aria-hidden="true">⭐</span>
            <span class="star" data-star="2" aria-hidden="true">⭐</span>
            <span class="star" data-star="3" aria-hidden="true">⭐</span>
          </div>
          <p class="result__score">总分 <strong id="result-score">0</strong></p>
          <p class="result__stats"><span id="result-moves">步数 0</span> · <span id="result-time">用时 0:00</span></p>
          <p id="result-encourage" class="result__encourage" hidden></p>
          <p id="result-record" class="result__record" hidden>🎉 新纪录！</p>
          <div class="panel__actions">
            <button id="btn-again" class="btn btn--primary" type="button">再来一局</button>
            <button id="btn-change-diff" class="btn btn--ghost" type="button">换难度</button>
            <button id="btn-result-lb" class="btn btn--ghost" type="button">排行榜</button>
          </div>
        </div>
      </section>

      <!-- 排行榜 -->
      <section id="screen-leaderboard" class="screen screen--overlay" role="dialog" aria-modal="true" aria-labelledby="lb-title" hidden>
        <div class="panel panel--wide">
          <h2 id="lb-title" class="panel__title">排行榜</h2>
          <div class="tabs" role="group" aria-label="难度页签">
            <button class="tab" type="button" data-lb-difficulty="easy" aria-pressed="true">简单</button>
            <button class="tab" type="button" data-lb-difficulty="normal" aria-pressed="false">普通</button>
            <button class="tab" type="button" data-lb-difficulty="hard" aria-pressed="false">困难</button>
            <button class="tab" type="button" data-lb-difficulty="challenge" aria-pressed="false">挑战</button>
          </div>
          <div class="lb-body">
            <table class="lb-table" id="lb-table">
              <caption class="sr-only">各难度前 5 名成绩</caption>
              <thead>
                <tr>
                  <th scope="col">名次</th><th scope="col">分数</th><th scope="col">步数</th>
                  <th scope="col">用时</th><th scope="col">星级</th><th scope="col">日期</th>
                </tr>
              </thead>
              <tbody id="lb-rows"></tbody>
            </table>
            <p id="lb-empty" class="lb-empty" hidden>还没有记录，来玩一局吧！</p>
          </div>
          <div class="panel__actions">
            <button id="btn-lb-clear" class="btn btn--ghost" type="button">清空记录</button>
            <button id="btn-lb-back" class="btn btn--primary" type="button">返回</button>
          </div>
        </div>
      </section>

      <!-- 二次确认 -->
      <div id="confirm" class="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-text" hidden>
        <div class="panel panel--small">
          <p id="confirm-text" class="panel__text">确定吗？</p>
          <div class="panel__actions">
            <button id="btn-confirm-cancel" class="btn btn--ghost" type="button">再想想</button>
            <button id="btn-confirm-ok" class="btn btn--primary" type="button">确定</button>
          </div>
        </div>
      </div>

      <div id="fx" class="fx" aria-hidden="true"></div>
      <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>

      <div id="boot-error" class="boot-error" hidden>
        <p class="boot-error__title">页面没能启动</p>
        <p class="boot-error__detail" id="boot-error-detail"></p>
        <p class="boot-error__hint">请刷新页面重试；若仍无法启动，请确认 src/ 与 styles/ 目录完整。</p>
      </div>

    </main>
  </div>

  <script src="src/core/rng.js"></script>
  <script src="src/core/config.js"></script>
  <script src="src/core/deck.js"></script>
  <script src="src/core/scoring.js"></script>
  <script src="src/core/timer.js"></script>
  <script src="src/core/leaderboard.js"></script>
  <script src="src/core/settings.js"></script>
  <script src="src/core/game.js"></script>
  <script src="src/render-model.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/fx.js"></script>
  <script src="src/render.js"></script>
  <script src="src/input.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
